<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nube BI</title>
  <meta name="description" content="Dashboards automáticos desde tus Excel, guardados en Google Drive.">
  <meta name="theme-color" content="#0f52ba">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnList" aria-label="Ver archivos">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>Nube BI</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="dot"></span><span class="status-text">Modo local</span>
    </div>
    <div class="top-actions">
      <button class="btn ghost hidden" id="btnInstall">Instalar app</button>
      <button class="btn" id="btnAuth">Conectar Google Drive</button>
      <div class="user hidden" id="user"></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-actions">
        <button class="btn primary block" id="btnUpload">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          Subir Excel
        </button>
        <button class="btn ghost block hidden" id="btnWatch" title="Abre un Excel de tu PC y la app lo vuelve a leer cada vez que lo guardes">
          Abrir y vigilar Excel
        </button>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.csv,.ods" multiple hidden>
      </div>
      <input class="search" id="search" type="search" placeholder="Buscar archivo…" aria-label="Buscar archivo">
      <nav class="file-list" id="fileList"></nav>
      <div class="storage hidden" id="storage"></div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="dropzone-overlay" id="dropOverlay"><div>Suelta tus Excel aquí</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
